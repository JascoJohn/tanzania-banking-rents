[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tzbank"
version = "0.9.0"
description = "The Economics of Dominance and Rents: market structure, profitability persistence and the investment value of CRDB and NMB"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT (code); CC BY 4.0 (data, tables and reports): see LICENSE and LICENSE-DATA.md" }
dependencies = [
  "pandas>=3.0",
  "numpy>=2.3",
  "openpyxl>=3.1",
  "pandera>=0.35",
  "pyyaml>=6.0",
  "scipy>=1.16",
  "statsmodels>=0.14",
  "matplotlib>=3.10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.17"]
dashboard = ["streamlit>=1.59"]
extract = ["PyMuPDF>=1.26", "ocrmypdf>=17"]
reports = ["python-docx>=1.2", "PyMuPDF>=1.26", "Pillow>=10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 140
target-version = "py311"
extend-exclude = ["_incoming", "data", "outputs", "reports"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: runs the full pipeline on the real data"]
